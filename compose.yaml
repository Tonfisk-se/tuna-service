

services:


    frontend-client:
      build:
        context: ./services/frontend-client
        dockerfile: Dockerfile
      ports:
        - "3000:3000"
    db:
      build:
        context: ./db
        dockerfile: Dockerfile
      ports:
        - "5432:5432"
      volumes:
        - pg_data:/var/lib/postgresql/data
      env_file:
        - .env.development
        - .env.production
      healthcheck:
        test: ["CMD", "pg_isready", "-q", "-d", "tuna_db", "-U", "tuna_user"]
        timeout: 30s
        interval: 10s
        retries: 5
      restart: always
    db-migration:
      build:
        context: ./db/migrations
        dockerfile: Dockerfile
      env_file:
        - .env.development
        - .env.production
      depends_on:
        db:
          condition: service_healthy
      command: ["npm", "run", "migrate:up"]
    api-gateway:
      build:
        context: ./services/api-gateway
        dockerfile: Dockerfile
      ports:
        - "4200:4200"
      depends_on:
        db:
          condition: service_healthy
          restart: true

volumes:
  pg_data:
